name: O03 PPC schema probe

on:
  push:
    branches:
      - o03-ppc-clinical-translation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public Supabase schema safely
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright

          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                ctx=await b.new_context(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36")
                pg=await ctx.new_page()
                auth_headers={}
                async def capture(r):
                    nonlocal auth_headers
                    if "booszbqgatqmsoxyhhrh.supabase.co/rest/v1/" in r.url and not auth_headers:
                        # Reuse in-process only. Never print auth/apikey.
                        for k,v in r.headers.items():
                            if k.lower() in ["apikey","authorization"]:
                                auth_headers[k]=v
                pg.on("request",capture)
                await pg.goto("https://panpreclinical.org/cl_vs_ex_vivo",wait_until="domcontentloaded",timeout=120000)
                await pg.wait_for_timeout(5000)
                base="https://booszbqgatqmsoxyhhrh.supabase.co/rest/v1"
                print("AUTH_CAPTURED",bool(auth_headers))
                # OpenAPI schema
                rr=await ctx.request.get(base+"/",headers={**auth_headers,"Accept":"application/openapi+json"},timeout=120000)
                body=await rr.body()
                print("SCHEMA_STATUS",rr.status,"BYTES",len(body),rr.headers.get("content-type"))
                try:
                    o=json.loads(body)
                    paths=list((o.get("paths") or {}).keys())
                    interesting=[x for x in paths if re.search(r'auc|cell|vivo|score|drug|sample|response|curve|comparison|model',x,re.I)]
                    print("INTERESTING_PATHS",json.dumps(interesting[:500],indent=2))
                except Exception as e:
                    print("SCHEMA_PARSE_ERR",repr(e),body[:2000].decode("utf-8","replace"))
                # Inspect distinct sample type / study values with a broad but shallow fetch.
                for endpoint in [
                    "sample_metadata?select=type,study_id,oncotree_code,main_type&limit=20000",
                    "drug_metadata?select=id,short_name,fda_approval,selleck_target&limit=5",
                    "cl_ex_vivo_moa_comparison?select=*&limit=3",
                    "mean_aucs_2d?select=*&limit=5",
                    "raw_mean_aucs_2d?select=*&limit=5",
                    "aucs_2d?select=*&limit=5",
                    "mean_aucs?select=*&limit=5",
                    "auc_metadata?select=*&limit=5",
                ]:
                    try:
                        q=await ctx.request.get(base+"/"+endpoint,headers=auth_headers,timeout=120000)
                        bb=await q.body()
                        print("ENDPOINT",endpoint,"STATUS",q.status,"BYTES",len(bb),"PREFIX",bb[:5000].decode("utf-8","replace"))
                    except Exception as e: print("ENDPOINT_ERR",endpoint,repr(e))
                await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
