name: O04 CDSDB download probe

on:
  push:
    branches:
      - o04-cdsdb-lincs-patient-concordance-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright requests beautifulsoup4 pandas
          python -m playwright install --with-deps chromium
      - name: Probe CDS-DB portal download surface
        shell: bash
        run: |
          mkdir -p o04_probe
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright

          OUT=Path("o04_probe")
          OUT.mkdir(exist_ok=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"

          async def probe(base):
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA,accept_downloads=True,ignore_https_errors=True)
                  pg=await ctx.new_page()
                  reqs=[]; resps=[]
                  def onreq(r):
                      if re.search(r'cds|download|dataset|signature|patient|api|ajax|export|tar|zip',r.url,re.I):
                          reqs.append({"method":r.method,"url":r.url,"resource_type":r.resource_type})
                  async def onresp(r):
                      try:
                          ct=r.headers.get("content-type","")
                          cl=r.headers.get("content-length","")
                          if re.search(r'cds|download|dataset|signature|patient|api|ajax|export|tar|zip',r.url,re.I) or any(x in ct.lower() for x in ["json","zip","octet","csv","excel"]):
                              resps.append({"status":r.status,"url":r.url,"ctype":ct,"content_length":cl})
                      except: pass
                  pg.on("request",onreq); pg.on("response",onresp)
                  try:
                      await pg.goto(base,wait_until="domcontentloaded",timeout=120000)
                      await pg.wait_for_timeout(7000)
                  except Exception as e:
                      print("GOTO_ERR",base,repr(e))
                  print("BASE",base,"TITLE",await pg.title(),"FINAL",pg.url)
                  html=await pg.content()
                  (OUT/(re.sub(r'[^a-z0-9]+','_',base.lower())+".html")).write_text(html,encoding="utf-8")
                  body=(await pg.locator("body").inner_text())[:30000]
                  print("BODY",body)
                  links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                  buttons=await pg.locator("button").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),id:e.id||'',cls:e.className||'',onclick:e.getAttribute('onclick')||''}))""")
                  print("LINKS",json.dumps([x for x in links if re.search(r'download|dataset|signature|patient|browse|tar|zip|export|all',json.dumps(x),re.I)][:300],indent=2))
                  print("BUTTONS",json.dumps([x for x in buttons if re.search(r'download|dataset|signature|patient|browse|export|all',json.dumps(x),re.I)][:300],indent=2))
                  print("REQS",json.dumps(reqs[-500:],indent=2))
                  print("RESPS",json.dumps(resps[-500:],indent=2))
                  (OUT/"links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")
                  (OUT/"buttons.json").write_text(json.dumps(buttons,indent=2),encoding="utf-8")
                  (OUT/"requests.json").write_text(json.dumps(reqs,indent=2),encoding="utf-8")
                  (OUT/"responses.json").write_text(json.dumps(resps,indent=2),encoding="utf-8")

                  # Search anchors with "Browse" or "Download", visit likely pages.
                  candidates=[]
                  for x in links:
                      if x.get("href") and re.search(r'browse|download|patient|dataset',x.get("text","")+" "+x.get("href",""),re.I):
                          candidates.append(x["href"])
                  seen=set()
                  for i,u in enumerate(candidates[:20]):
                      if u in seen: continue
                      seen.add(u)
                      p2=await ctx.new_page()
                      subreq=[]; subresp=[]
                      p2.on("request",lambda r: subreq.append({"method":r.method,"url":r.url}) if re.search(r'download|dataset|signature|patient|api|export|tar|zip',r.url,re.I) else None)
                      async def cap(r):
                          try:
                              ct=r.headers.get("content-type","")
                              if re.search(r'download|dataset|signature|patient|api|export|tar|zip',r.url,re.I) or any(x in ct.lower() for x in ["json","zip","octet","csv","excel"]):
                                  subresp.append({"status":r.status,"url":r.url,"ctype":ct})
                          except: pass
                      p2.on("response",cap)
                      try:
                          await p2.goto(u,wait_until="domcontentloaded",timeout=90000)
                          await p2.wait_for_timeout(4000)
                          print("SUBPAGE",i,u,"TITLE",await p2.title(),"FINAL",p2.url)
                          print("SUBBODY",(await p2.locator("body").inner_text())[:15000])
                          sl=await p2.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                          sb=await p2.locator("button").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),id:e.id||'',cls:e.className||'',onclick:e.getAttribute('onclick')||''}))""")
                          print("SUBLINKS",json.dumps([x for x in sl if re.search(r'download|all|tar|zip|export|signature',json.dumps(x),re.I)][:200],indent=2))
                          print("SUBBUTTONS",json.dumps([x for x in sb if re.search(r'download|all|export|signature',json.dumps(x),re.I)][:200],indent=2))
                          print("SUBREQ",json.dumps(subreq[-200:],indent=2))
                          print("SUBRESP",json.dumps(subresp[-200:],indent=2))
                      except Exception as e:
                          print("SUBERR",u,repr(e))
                      await p2.close()
                  await b.close()

          async def main():
              for base in ["https://cdsdb.ncpsb.org.cn/","http://cdsdb.ncpsb.org.cn/","https://cdsdb.cloudna.cn/","http://cdsdb.cloudna.cn/"]:
                  try: await probe(base)
                  except Exception as e: print("BASE_ERR",base,repr(e))
          asyncio.run(main())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o04-cdsdb-probe
          path: o04_probe/
          retention-days: 3
