name: O04 CDSDB signature API probe

on:
  push:
    branches:
      - o04-cdsdb-lincs-patient-concordance-20260919

jobs:
  probe_signature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe analysis-result APIs
        shell: bash
        run: |
          cat > /tmp/probe_sig.py <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright
          BASE="http://cdsdb.ncpsb.org.cn"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          IDS=["CDS_dataset_Microarray_107","CDS_dataset_Microarray_115","CDS_dataset_Microarray_116"]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(user_agent=UA)
              for did in IDS:
                pg=await ctx.new_page()
                calls=[]
                async def resp(r):
                  if r.request.resource_type in ["xhr","fetch"] or re.search(r'analysis|signature|profile|metadata|job|deg|result|cdsdb|apiFlask',r.url,re.I):
                    try:
                      body=await r.body()
                      ct=r.headers.get("content-type","")
                      calls.append({"method":r.request.method,"url":r.url,"status":r.status,"ctype":ct,
                                    "post_data":r.request.post_data,
                                    "prefix":body[:10000].decode("utf-8","replace") if ("json" in ct or "text" in ct) else f"<binary {len(body)}>"})
                    except Exception as e:
                      calls.append({"url":r.url,"status":r.status,"err":repr(e)})
                pg.on("response",resp)
                url=BASE+f"/analysisResult?level=raw/dataset&jobId={did}"
                try:
                  await pg.goto(url,wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(8000)
                  print("PAGE",did,await pg.title(),pg.url)
                  print("BODY",did,(await pg.locator("body").inner_text())[:20000])
                except Exception as e: print("PAGE_ERR",did,repr(e))
                print("CALLS_BEGIN",did)
                for x in calls:
                  print(json.dumps(x,ensure_ascii=False)[:20000])
                print("CALLS_END",did)
                await pg.close()
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe_sig.py
