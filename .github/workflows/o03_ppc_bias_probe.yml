name: O03 PPC bias endpoint probe

on:
  push:
    branches:
      - o03-ppc-clinical-translation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture Cell Line vs Ex Vivo data
        shell: bash
        run: |
          mkdir -p o03_ppc_bias
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re,hashlib
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path("o03_ppc_bias"); OUT.mkdir(exist_ok=True)
          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                ctx=await b.new_context(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
                                        viewport={"width":1440,"height":1200})
                pg=await ctx.new_page()
                seen=[]
                async def resp(r):
                    if "supabase.co/rest/v1/" not in r.url: return
                    try:
                        body=await r.body()
                    except Exception as e:
                        print("SUPA_ERR",r.url,repr(e)); return
                    name=re.sub(r'[^A-Za-z0-9_.-]+','_',r.url.split("/rest/v1/")[-1])[:140]
                    path=OUT/(name+".bin")
                    path.write_bytes(body)
                    item={"url":r.url,"status":r.status,"ctype":r.headers.get("content-type",""),
                          "bytes":len(body),"file":path.name,
                          "prefix":body[:2500].decode("utf-8","replace")}
                    seen.append(item)
                    print("SUPA",json.dumps(item)[:10000])
                pg.on("response",resp)
                await pg.goto("https://panpreclinical.org/cl_vs_ex_vivo",wait_until="domcontentloaded",timeout=120000)
                await pg.wait_for_timeout(15000)
                print("TITLE",await pg.title(),"URL",pg.url)
                body=await pg.locator("body").inner_text()
                print("BODY",body[:16000].replace("\n"," | "))
                # interact with any broad selectors/buttons once to trigger lazy data.
                buttons=await pg.locator("button").all()
                print("BUTTON_N",len(buttons))
                for idx,bt in enumerate(buttons[:30]):
                    try:
                        txt=(await bt.inner_text()).strip()
                        print("BUTTON",idx,txt[:200])
                    except: pass
                (OUT/"events.json").write_text(json.dumps(seen,indent=2),encoding="utf-8")
                await pg.screenshot(path=str(OUT/"page.png"),full_page=True)
                await b.close()
          asyncio.run(main())
          print("FILES")
          for p in OUT.iterdir():
              if p.is_file():
                  print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o03-ppc-bias-probe
          path: o03_ppc_bias/
          retention-days: 3
