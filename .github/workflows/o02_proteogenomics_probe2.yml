name: O02 proteogenomics robust probe

on:
  push:
    branches:
      - o02-cross-ancestry-proteogenomics-20260919

jobs:
  robust_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install requests pandas openpyxl playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
      - name: Robustly recover EAS and EUR supplements
        shell: bash
        run: |
          mkdir -p o02_probe2
          cat > /tmp/o02_probe2.py <<'PY'
          import io, json, re, os, asyncio, hashlib, time
          from pathlib import Path
          import requests, pandas as pd
          from playwright.async_api import async_playwright

          OUT=Path("o02_probe2"); OUT.mkdir(exist_ok=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          H={"User-Agent":UA,"Accept":"*/*"}

          def stream_download(url,path,tries=6):
              err=None
              for a in range(tries):
                  try:
                      with requests.get(url,headers=H,timeout=300,stream=True,allow_redirects=True) as r:
                          print("HTTP",url,"TRY",a+1,"STATUS",r.status_code,"CTYPE",r.headers.get("content-type"),"FINAL",r.url)
                          if r.status_code>=500:
                              err=RuntimeError(f"HTTP {r.status_code}")
                              time.sleep(3*(a+1)); continue
                          r.raise_for_status()
                          with open(path,"wb") as f:
                              for chunk in r.iter_content(chunk_size=1024*1024):
                                  if chunk: f.write(chunk)
                          print("SAVED",path,Path(path).stat().st_size)
                          return Path(path)
                  except Exception as e:
                      err=e; print("DOWNLOAD_ERR",repr(e)); time.sleep(3*(a+1))
              raise err

          # ---------- East Asian Zenodo ----------
          api="https://zenodo.org/api/records/21503247"
          meta=requests.get(api,headers=H,timeout=120).json()
          (OUT/"zenodo_record.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("ZENODO_TITLE",meta.get("metadata",{}).get("title"))
          print("ZENODO_FILES",json.dumps([{"key":f.get("key"),"size":f.get("size"),"links":f.get("links")} for f in meta.get("files",[])],indent=2)[:12000])
          eas_path=None
          for f in meta.get("files",[]):
              if str(f.get("key","")).lower()=="supplementary tables.xlsx":
                  urls=[]
                  links=f.get("links") or {}
                  for k in ["content","self"]:
                      if links.get(k): urls.append(links[k])
                  # canonical record file URL fallback
                  urls.append("https://zenodo.org/records/21503247/files/Supplementary%20Tables.xlsx?download=1")
                  for u in urls:
                      try:
                          eas_path=stream_download(u,OUT/"EAS_Supplementary_Tables.xlsx",tries=4)
                          if eas_path and eas_path.stat().st_size>1000000: break
                      except Exception as e: print("EAS_URL_FAIL",u,repr(e))
                  break

          # browser fallback for EAS
          async def browser_recover_eas_and_eur():
              eas_browser=None; eur_files=[]
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(accept_downloads=True,user_agent=UA)

                  if eas_path is None or not Path(eas_path).exists() or Path(eas_path).stat().st_size<1000000:
                      pg=await ctx.new_page()
                      await pg.goto("https://zenodo.org/records/21503247",wait_until="domcontentloaded",timeout=120000)
                      await pg.wait_for_timeout(3000)
                      links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                      matches=[x for x in links if re.search(r'Supplementary Tables\.xlsx',json.dumps(x),re.I)]
                      print("ZENODO_BROWSER_MATCH",json.dumps(matches,indent=2))
                      for x in matches:
                          u=x.get("href")
                          if not u: continue
                          try:
                              rr=await ctx.request.get(u,timeout=180000)
                              body=await rr.body()
                              print("ZENODO_BROWSER_GET",u,rr.status,len(body),rr.headers.get("content-type"))
                              if rr.status==200 and len(body)>1000000:
                                  dest=OUT/"EAS_Supplementary_Tables.xlsx"
                                  dest.write_bytes(body); eas_browser=str(dest); break
                          except Exception as e: print("ZENODO_BROWSER_ERR",repr(e))

                  pg=await ctx.new_page()
                  eur_url="https://www.medrxiv.org/content/10.64898/2026.07.23.26358667v1"
                  await pg.goto(eur_url,wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(5000)
                  print("EUR_TITLE",await pg.title(),"URL",pg.url)
                  links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                  (OUT/"eur_links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")
                  cand=[x for x in links if re.search(r'supplement|additional|supp|\.xlsx|\.xls|\.zip|\.docx|\.csv|DC\d',json.dumps(x),re.I)]
                  print("EUR_CANDIDATE_LINKS",json.dumps(cand,indent=2)[:20000])

                  # try candidates; save binary non-html objects
                  seen=set()
                  for i,x in enumerate(cand):
                      u=x.get("href")
                      if not u or u in seen: continue
                      seen.add(u)
                      try:
                          rr=await ctx.request.get(u,timeout=180000)
                          body=await rr.body(); ct=rr.headers.get("content-type","")
                          print("EUR_GET",i,u,"STATUS",rr.status,"CTYPE",ct,"BYTES",len(body))
                          if rr.status==200 and len(body)>5000:
                              # accept Office/zip/pdf/csv or PK magic, reject ordinary html
                              isbin=(body[:2]==b"PK" or body[:4]==b"%PDF" or
                                     any(t in ct.lower() for t in ["spreadsheet","zip","pdf","word","csv","octet-stream"]))
                              if isbin:
                                  ext=".bin"
                                  if body[:2]==b"PK": ext=".zip"
                                  if body[:4]==b"%PDF": ext=".pdf"
                                  if "spreadsheet" in ct: ext=".xlsx"
                                  if "word" in ct: ext=".docx"
                                  if "csv" in ct: ext=".csv"
                                  base=re.sub(r'[^A-Za-z0-9_.-]+','_',u.split("/")[-1].split("?")[0])[-120:] or f"eur_{i}"
                                  dest=OUT/(f"EUR_{i}_{base}"+("" if "." in base else ext))
                                  dest.write_bytes(body); eur_files.append(str(dest))
                      except Exception as e: print("EUR_GET_ERR",u,repr(e))

                  # scan HTML for hidden supplementary endpoints
                  html=await pg.content()
                  (OUT/"eur_page.html").write_text(html,encoding="utf-8")
                  hidden=sorted(set(re.findall(r'https?[^"\'<> ]+',html)))
                  hidden=[u for u in hidden if re.search(r'supp|DC\d|\.xlsx|\.zip|\.docx|\.csv',u,re.I)]
                  print("EUR_HIDDEN_URLS",json.dumps(hidden[:200],indent=2))
                  for j,u in enumerate(hidden[:50]):
                      if u in seen: continue
                      try:
                          rr=await ctx.request.get(u,timeout=180000)
                          body=await rr.body(); ct=rr.headers.get("content-type","")
                          print("EUR_HIDDEN_GET",j,u,rr.status,ct,len(body))
                          if rr.status==200 and len(body)>5000 and (body[:2]==b"PK" or body[:4]==b"%PDF" or
                              any(t in ct.lower() for t in ["spreadsheet","zip","pdf","word","csv","octet-stream"])):
                              ext=".zip" if body[:2]==b"PK" else ".pdf" if body[:4]==b"%PDF" else ".bin"
                              dest=OUT/f"EUR_hidden_{j}{ext}"; dest.write_bytes(body); eur_files.append(str(dest))
                      except Exception as e: print("EUR_HIDDEN_ERR",u,repr(e))
                  await b.close()
              return eas_browser,eur_files

          eas_browser,eur_files=asyncio.run(browser_recover_eas_and_eur())
          if eas_browser: eas_path=Path(eas_browser)
          print("EAS_FINAL",str(eas_path) if eas_path else None)
          print("EUR_FILES",json.dumps(eur_files))

          # inspect all workbooks / zip-contained workbooks
          def inspect_excel_bytes(data,label):
              try:
                  xf=pd.ExcelFile(io.BytesIO(data))
              except Exception as e:
                  print("EXCEL_OPEN_ERR",label,repr(e)); return
              print("XLS_SHEETS",label,json.dumps(xf.sheet_names))
              for sh in xf.sheet_names:
                  try:
                      raw=pd.read_excel(io.BytesIO(data),sheet_name=sh,header=None,nrows=15)
                      print("RAW",label,sh,raw.head(12).to_json(orient="split",default_handler=str)[:10000])
                      # also standard header
                      df=pd.read_excel(io.BytesIO(data),sheet_name=sh,nrows=6)
                      print("HDR",label,sh,"COLS",json.dumps([str(c) for c in df.columns[:100]]))
                  except Exception as e: print("SHEET_ERR",label,sh,repr(e))

          if eas_path and Path(eas_path).exists():
              inspect_excel_bytes(Path(eas_path).read_bytes(),"EAS")

          import zipfile
          for f in eur_files:
              p=Path(f); data=p.read_bytes()
              if data[:2]==b"PK":
                  # Could be xlsx/docx/zip. First try as Excel directly.
                  inspect_excel_bytes(data,p.name)
                  try:
                      z=zipfile.ZipFile(io.BytesIO(data))
                      names=z.namelist()
                      print("ZIP_NAMES",p.name,json.dumps(names[:200]))
                      for n in names:
                          if re.search(r'\.(xlsx|xls|csv|tsv)$',n,re.I):
                              d=z.read(n)
                              print("ZIP_MEMBER",p.name,n,len(d))
                              if n.lower().endswith((".xlsx",".xls")):
                                  inspect_excel_bytes(d,p.name+"::"+n)
                              else:
                                  print(d[:5000].decode("utf-8","replace"))
                  except Exception as e: print("ZIP_ERR",p.name,repr(e))

          print("FILES")
          for p in OUT.iterdir():
              if p.is_file():
                  print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python /tmp/o02_probe2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o02-proteogenomics-probe2
          path: o02_probe2/
          retention-days: 3
