name: O06 Gateway x PsychAD data-contract probe

on:
  push:
    branches:
      - o06-gateway-brain-validation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install requests pandas beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
      - name: Probe public Gateway and PsychAD data contracts
        shell: bash
        run: |
          mkdir -p o06_probe
          cat > /tmp/o06_probe.py <<'PY'
          import asyncio, json, re, gzip, io, os, hashlib
          from pathlib import Path
          import requests, pandas as pd
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright

          OUT=Path("o06_probe")
          CID="8b35aa1f-6bcf-4a51-abc3-a3f336a44ae6"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          H={"User-Agent":UA,"Accept":"*/*"}

          def get(url,**kw):
              r=requests.get(url,headers=H,timeout=180,allow_redirects=True,**kw)
              print("GET",url,"STATUS",r.status_code,"CTYPE",r.headers.get("content-type"),"BYTES",len(r.content),"FINAL",r.url)
              return r

          # 1) Try public CELLxGENE APIs directly.
          api_candidates=[
            f"https://api.cellxgene.cziscience.com/curation/v1/collections/{CID}",
            f"https://api.cellxgene.cziscience.com/dp/v1/collections/{CID}",
            f"https://api.cellxgene.cziscience.com/curation/v1/collections/{CID}/datasets",
          ]
          for i,u in enumerate(api_candidates):
              try:
                  r=get(u)
                  (OUT/f"cellxgene_api_{i}.txt").write_bytes(r.content)
                  if r.status_code==200:
                      try:
                          o=r.json()
                          print("CELLXGENE_API_JSON",i,json.dumps(o,indent=2)[:30000])
                      except Exception as e:
                          print("CELLXGENE_JSON_ERR",i,repr(e))
              except Exception as e:
                  print("CELLXGENE_API_ERR",i,repr(e))

          # 2) Browser network capture from public collection page; only URL/status/body schema, no auth printing.
          async def browser_probe():
              net=[]
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA)
                  pg=await ctx.new_page()
                  async def onresp(resp):
                      u=resp.url
                      if ("cellxgene" in u or "cziscience" in u) and any(k in u.lower() for k in ["api","collection","dataset"]):
                          try:
                              body=await resp.body()
                              ct=resp.headers.get("content-type","")
                              item={"url":u,"status":resp.status,"ctype":ct,"bytes":len(body)}
                              if "json" in ct and len(body)<5_000_000:
                                  try:item["json"]=json.loads(body)
                                  except: item["prefix"]=body[:3000].decode("utf-8","replace")
                              net.append(item)
                              print("NET",json.dumps(item,default=str)[:20000])
                          except Exception as e:
                              print("NET_ERR",u,repr(e))
                  pg.on("response",onresp)
                  url=f"https://cellxgene.cziscience.com/collections/{CID}"
                  await pg.goto(url,wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(8000)
                  print("CELLXGENE_TITLE",await pg.title())
                  print("CELLXGENE_BODY",(await pg.locator("body").inner_text())[:20000])
                  html=await pg.content()
                  (OUT/"cellxgene_collection.html").write_text(html,encoding="utf-8")
                  await b.close()
              (OUT/"cellxgene_network.json").write_text(json.dumps(net,indent=2,default=str),encoding="utf-8")
              return net
          net=asyncio.run(browser_probe())

          # Harvest dataset IDs and asset URLs from any captured JSON/text.
          corpus=json.dumps(net,default=str)
          corpus += "\n" + "\n".join(
              p.read_text(encoding="utf-8",errors="ignore") for p in OUT.glob("cellxgene_api_*.txt")
          )
          uuids=sorted(set(re.findall(r'\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b',corpus,re.I)))
          print("CELLXGENE_UUIDS",json.dumps(uuids))
          urls=sorted(set(re.findall(r'https?[^"\\\s<>]+',corpus)))
          asset_urls=[u for u in urls if any(x in u.lower() for x in [".h5ad","dataset","asset","download"])]
          print("CELLXGENE_ASSET_URLS",json.dumps(asset_urls[:200],indent=2))

          # 3) PsychAD PMC article: discover public supplementary URLs.
          psych_url="https://pmc.ncbi.nlm.nih.gov/articles/PMC12833908/"
          pr=get(psych_url)
          (OUT/"psychad_article.html").write_bytes(pr.content)
          html=pr.text
          soup=BeautifulSoup(html,"lxml")
          links=[]
          for a in soup.find_all("a",href=True):
              href=urljoin(pr.url,a["href"])
              txt=" ".join(a.stripped_strings)
              if re.search(r'media-[0-9]+|supplement|supplementary',href+" "+txt,re.I):
                  links.append({"text":txt,"href":href})
          print("PSYCH_SUPP_LINKS",json.dumps(links,indent=2)[:30000])
          (OUT/"psychad_supp_links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")

          # Explicit candidate locations for public Supplement 4.
          candidates=[]
          for x in links:
              if re.search(r'media-4\.gz|supplement.?4',x["href"]+" "+x["text"],re.I):
                  candidates.append(x["href"])
          candidates += [
              "https://pmc.ncbi.nlm.nih.gov/articles/instance/12833908/bin/media-4.gz",
              "https://pmc.ncbi.nlm.nih.gov/articles/PMC12833908/bin/media-4.gz"
          ]
          seen=set(); got=None
          for u in candidates:
              if u in seen: continue
              seen.add(u)
              try:
                  r=get(u)
                  if r.status_code==200 and len(r.content)>10000:
                      data=r.content
                      # If HTML wrapper, skip.
                      if b"<html" in data[:1000].lower(): continue
                      (OUT/"psychad_media4.gz").write_bytes(data)
                      print("PSYCH_MEDIA4_SHA256",hashlib.sha256(data).hexdigest())
                      got=data; break
              except Exception as e:
                  print("PSYCH_MEDIA4_ERR",u,repr(e))

          if got:
              # inspect gzip payload first lines and attempt dataframe parsing
              try:
                  dec=gzip.decompress(got)
                  print("PSYCH_MEDIA4_DECOMP_BYTES",len(dec))
                  print("PSYCH_MEDIA4_PREFIX",dec[:10000].decode("utf-8","replace"))
                  (OUT/"psychad_media4_decompressed_prefix.txt").write_bytes(dec[:1_000_000])
                  # auto detect separator
                  txt=dec.decode("utf-8","replace")
                  for sep in ["\t",","]:
                      try:
                          df=pd.read_csv(io.StringIO(txt),sep=sep,nrows=10)
                          if len(df.columns)>2:
                              print("PSYCH_TABLE_COLS",json.dumps(list(map(str,df.columns))[:200]))
                              print("PSYCH_TABLE_HEAD",df.head().to_json(orient="records",default_handler=str)[:20000])
                              break
                      except Exception as e: print("PSYCH_PARSE_ERR",sep,repr(e))
              except Exception as e:
                  print("PSYCH_GZIP_ERR",repr(e))
          PY
          python /tmp/o06_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o06-data-contract-probe
          path: o06_probe/
          retention-days: 3
