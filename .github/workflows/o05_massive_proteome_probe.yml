name: O05 MassIVE processed proteome probe

on:
  push:
    branches:
      - o05-cross-species-proteome-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Probe MassIVE processed files
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import requests,re,json
          accessions={
            "human":"MSV000099729",
            "cyno":"MSV000099734",
            "dog":"MSV000099744",
            "pig":"MSV000099746",
            "rat":"MSV000099753",
            "mouse":"MSV000099754",
          }
          H={"User-Agent":"o05-cross-species/0.1"}
          for sp,acc in accessions.items():
              urls=[
                f"https://massive.ucsd.edu/ProteoSAFe/dataset_files.jsp?task={acc}",
                f"https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.{acc}",
                f"https://proteomecentral.proteomexchange.org/cgi/GetDataset?ID={acc}",
                f"https://massive.ucsd.edu/ProteoSAFe/static/massive.jsp?task={acc}",
              ]
              print("SPECIES",sp,acc)
              for u in urls:
                  try:
                      r=requests.get(u,headers=H,timeout=90,allow_redirects=True)
                      print("URL",u,"STATUS",r.status_code,"BYTES",len(r.content),"FINAL",r.url,"CTYPE",r.headers.get("content-type"))
                      txt=r.text if "text" in (r.headers.get("content-type") or "") or len(r.content)<5000000 else ""
                      hits=sorted(set(re.findall(r'[^"\'<>\s]{0,160}(?:t04_protein_postbridge_ibaq_pd\.txt|\.txt|\.tsv|\.csv)[^"\'<>\s]{0,80}',txt,re.I)))
                      if hits: print("HITS",json.dumps(hits[:200]))
                  except Exception as e: print("ERR",repr(e))
          PY
          for acc in MSV000099729 MSV000099734 MSV000099744 MSV000099746 MSV000099753 MSV000099754; do
            echo "FTP $acc"
            curl -L --max-time 60 --list-only "ftp://massive-ftp.ucsd.edu/v11/$acc/" 2>&1 | head -200 || true
            echo "HTTPS_DIR $acc"
            curl -L --max-time 60 "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.$acc" 2>&1 | head -100 || true
          done
