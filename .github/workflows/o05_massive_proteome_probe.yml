name: O05 MassIVE processed proteome probe

on:
  push:
    branches:
      - o05-cross-species-proteome-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Resolve processed files through public MassIVE proxy index
        run: |
          python - <<'PY'
          import requests,json
          datasets={
            "human":"MSV000099729",
            "cyno":"MSV000099734",
            "dog":"MSV000099744",
            "pig":"MSV000099746",
            "rat":"MSV000099753",
            "mouse":"MSV000099754",
          }
          H={"User-Agent":"o05-cross-species/0.2"}
          base="https://massiveproxy.gnps2.org/ftpfilelog/datasets"
          for sp,acc in datasets.items():
              u=f"{base}/{acc}/files"
              r=requests.get(u,headers=H,timeout=90)
              print("LIST",sp,acc,r.status_code,len(r.content),r.headers.get("content-type"))
              if r.status_code!=200:
                  print(r.text[:1000]); continue
              try: obj=r.json()
              except Exception:
                  obj=r.text.splitlines()
              print("TYPE",type(obj).__name__)
              # normalize all path-like strings recursively
              vals=[]
              def walk(x):
                  if isinstance(x,str): vals.append(x)
                  elif isinstance(x,list):
                      for y in x: walk(y)
                  elif isinstance(x,dict):
                      for y in x.values(): walk(y)
              walk(obj)
              hits=sorted({x for x in vals if "t04_protein_postbridge_ibaq_pd.txt" in x})
              print("HITS",sp,json.dumps(hits))
              # broader processed files
              broad=sorted({x for x in vals if any(k in x.lower() for k in ["postbridge","ibaq","protein"]) and x.lower().endswith((".txt",".tsv",".csv"))})
              print("BROAD",sp,json.dumps(broad[:100]))
          PY
