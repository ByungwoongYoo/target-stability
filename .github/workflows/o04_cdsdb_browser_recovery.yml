name: O04 CDSDB browser recovery

on:
  push:
    branches:
      - o04-cdsdb-lincs-patient-concordance-20260919

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright pandas
          python -m playwright install --with-deps chromium
      - name: Recover CDS-DB via browser session
        shell: bash
        run: |
          mkdir -p o04_recovery
          cat > /tmp/recover.py <<'PY'
          import asyncio,json,re,io,tarfile,zipfile,os,hashlib
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path("o04_recovery"); OUT.mkdir(exist_ok=True)
          BASE="http://cdsdb.ncpsb.org.cn"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(user_agent=UA,accept_downloads=True)
              pg=await ctx.new_page()
              dataset_req={}
              async def cap_req(r):
                nonlocal dataset_req
                if r.url.endswith("/cdsdb/browse/dataset") and r.method=="POST":
                  dataset_req={"url":r.url,"post_data":r.post_data,"headers":dict(r.headers)}
              pg.on("request",cap_req)
              await pg.goto(BASE+"/browse/dataset",wait_until="domcontentloaded",timeout=120000)
              await pg.wait_for_timeout(6000)
              print("DATASET_REQ",json.dumps(dataset_req,indent=2)[:12000])

              # Try browser-context request on captured table API.
              rows=[]
              if dataset_req:
                hdr={k:v for k,v in dataset_req["headers"].items() if k.lower() not in ["content-length","host","cookie"]}
                rr=await ctx.request.post(dataset_req["url"],headers=hdr,data=dataset_req.get("post_data") or "",timeout=120000)
                body=await rr.body()
                print("TABLE_REPLAY",rr.status,rr.headers.get("content-type"),len(body),body[:8000].decode("utf-8","replace"))
                try:
                  obj=json.loads(body)
                  (OUT/"dataset_page.json").write_text(json.dumps(obj,indent=2,ensure_ascii=False),encoding="utf-8")
                  def walk(x):
                    if isinstance(x,list):
                      for y in x: walk(y)
                    elif isinstance(x,dict):
                      # likely table rows have a CDS_dataset id somewhere
                      s=json.dumps(x,ensure_ascii=False)
                      if "CDS_dataset_" in s: rows.append(x)
                      for y in x.values(): walk(y)
                  walk(obj)
                except Exception as e: print("TABLE_JSON_ERR",repr(e))
              print("ROWS_FOUND",len(rows))
              for x in rows[:30]: print("ROW",json.dumps(x,ensure_ascii=False)[:4000])

              # DOM fallback: collect visible dataset IDs and surrounding row text.
              dom=[]
              trs=pg.locator("tr")
              for i in range(await trs.count()):
                t=(await trs.nth(i).inner_text()).strip()
                m=re.search(r'(CDS_dataset_[A-Za-z0-9_]+)',t)
                if m: dom.append({"id":m.group(1),"text":t})
              print("DOM_ROWS",len(dom),json.dumps(dom[:30],ensure_ascii=False,indent=2))

              # Candidate IDs from both JSON and DOM.
              ids={}
              for d in dom: ids[d["id"]]=d["text"]
              for x in rows:
                s=json.dumps(x,ensure_ascii=False)
                m=re.search(r'CDS_dataset_[A-Za-z0-9_]+',s)
                if m: ids.setdefault(m.group(0),s)
              print("CANDIDATE_IDS",len(ids),json.dumps(list(ids.items())[:50],ensure_ascii=False,indent=2))

              # Individually download visible/surfaced datasets; smaller than Download All.
              successes=[]
              for idx,(did,desc) in enumerate(list(ids.items())[:30]):
                url=BASE+"/apiFlask/downloadData?id="+did+"&level=dataset"
                try:
                  rr=await ctx.request.get(url,timeout=120000)
                  body=await rr.body(); ct=rr.headers.get("content-type","")
                  print("DL",idx,did,rr.status,ct,len(body),rr.url)
                  if rr.status==200 and len(body)>200:
                    ext=".bin"
                    if body[:2]==b"PK": ext=".zip"
                    elif body[:2]==b"\x1f\x8b": ext=".tar.gz"
                    elif len(body)>262 and body[257:262]==b"ustar": ext=".tar"
                    path=OUT/(did+ext)
                    path.write_bytes(body)
                    successes.append({"id":did,"desc":desc,"path":str(path),"bytes":len(body),"ctype":ct,
                                      "sha256":hashlib.sha256(body).hexdigest()})
                except Exception as e: print("DL_ERR",did,repr(e))

              # If none, try actual browser click for Download All to determine behavior.
              if not successes:
                try:
                  async with pg.expect_download(timeout=120000) as di:
                    await pg.get_by_text("Download All",exact=True).first.click()
                  dl=await di.value
                  dest=OUT/"download_all_browser.bin"
                  await dl.save_as(str(dest))
                  print("BROWSER_DOWNLOAD",dl.suggested_filename,dest.stat().st_size)
                except Exception as e: print("BROWSER_DOWNLOAD_ERR",repr(e))

              print("SUCCESS_COUNT",len(successes))
              (OUT/"download_manifest.json").write_text(json.dumps(successes,indent=2,ensure_ascii=False),encoding="utf-8")

              # Inspect archive members and first text snippets.
              for s in successes[:8]:
                path=Path(s["path"]); data=path.read_bytes()
                print("ARCHIVE_INSPECT",path.name)
                try:
                  if data[:2]==b"PK":
                    z=zipfile.ZipFile(io.BytesIO(data))
                    names=z.namelist(); print("ZIP_NAMES",json.dumps(names[:100]))
                    for n in names[:20]:
                      if re.search(r'(metadata|signature|profile)\.txt$',n,re.I):
                        print("MEMBER",n,z.read(n)[:5000].decode("utf-8","replace"))
                  else:
                    t=tarfile.open(fileobj=io.BytesIO(data),mode="r:*")
                    names=t.getnames(); print("TAR_NAMES",json.dumps(names[:100]))
                    for n in names[:20]:
                      if re.search(r'(metadata|signature|profile)\.txt$',n,re.I):
                        print("MEMBER",n,t.extractfile(n).read()[:5000].decode("utf-8","replace"))
                except Exception as e: print("ARCHIVE_ERR",path.name,repr(e))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/recover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o04-cdsdb-browser-recovery
          path: o04_recovery/
          retention-days: 5
