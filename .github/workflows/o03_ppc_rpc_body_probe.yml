name: O03 PPC RPC request-body probe

on:
  push:
    branches:
      - o03-ppc-clinical-translation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture RPC request bodies
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright

          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                ctx=await b.new_context(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36")
                pg=await ctx.new_page()
                def req(r):
                    if "supabase.co/rest/v1/" in r.url:
                        print("REQ",json.dumps({
                          "method":r.method,
                          "url":r.url,
                          "post_data":r.post_data,
                          "headers":{k:v for k,v in r.headers.items() if k.lower() in ["content-type","prefer","range"]}
                        })[:20000])
                pg.on("request",req)
                for route in ["aucs","auc_disease","cl_vs_ex_vivo","drugs"]:
                    print("ROUTE_START",route)
                    await pg.goto(f"https://panpreclinical.org/{route}",wait_until="domcontentloaded",timeout=120000)
                    await pg.wait_for_timeout(7000)
                await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
