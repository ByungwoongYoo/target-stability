name: O05 GEO compact object probe

on:
  push:
    branches:
      - o05-cross-species-proteome-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Probe compact RDS objects
        shell: bash
        run: |
          set -euo pipefail
          gses=(325522 325523 325525)
          for idx in 0 1 2; do
            i=$((idx+1))
            gse=${gses[$idx]}
            url="https://ftp.ncbi.nlm.nih.gov/geo/series/GSE325nnn/GSE${gse}/suppl/GSE${gse}_meta.mat.human.egid${i}.rds"
            echo "URL $url"
            curl -L --retry 3 --fail --silent --show-error -o "/tmp/x${i}.rds" "$url"
            ls -lh "/tmp/x${i}.rds"
            Rscript -e 'x<-readRDS(commandArgs(TRUE)[1]); cat("TOP_CLASS",paste(class(x),collapse=","),"LEN",length(x),"NAMES",paste(names(x),collapse="|"),"\n"); for(j in seq_along(x)){y<-x[[j]]; cat("ITEM",j,"CLASS",paste(class(y),collapse=","),"DIM",paste(dim(y),collapse="x"),"LEN",length(y),"\n"); if(is.data.frame(y)){cat("COLS",paste(colnames(y),collapse="|"),"\n"); print(head(y,3))}; if(is.matrix(y)||inherits(y,"Matrix")){cat("ROWNAMES",paste(head(rownames(y),5),collapse="|"),"\n"); cat("COLNAMES",paste(head(colnames(y),10),collapse="|"),"\n"); print(y[seq_len(min(3,nrow(y))),seq_len(min(5,ncol(y))),drop=FALSE])}}' "/tmp/x${i}.rds"
            rm "/tmp/x${i}.rds"
          done
