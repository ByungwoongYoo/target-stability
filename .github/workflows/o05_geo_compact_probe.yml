name: O05 GEO compact object probe

on:
  push:
    branches:
      - o05-cross-species-proteome-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Probe compact RDS objects
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            gse=$((325521+i))
            url="https://ftp.ncbi.nlm.nih.gov/geo/series/GSE325nnn/GSE${gse}/suppl/GSE${gse}_meta.mat.human.egid${i}.rds"
            echo "URL $url"
            curl -L --retry 3 --fail --silent --show-error -o "/tmp/x${i}.rds" "$url"
            ls -lh "/tmp/x${i}.rds"
            Rscript -e 'x<-readRDS(commandArgs(TRUE)[1]); cat("CLASS",paste(class(x),collapse=","),"\n"); cat("DIM",paste(dim(x),collapse="x"),"LEN",length(x),"\n"); if(is.list(x)) {cat("NAMES",paste(names(x),collapse="|"),"\n"); for(nm in names(x)){y<-x[[nm]]; cat("ITEM",nm,"CLASS",paste(class(y),collapse=","),"DIM",paste(dim(y),collapse="x"),"LEN",length(y),"\n"); if(!is.null(dim(y))){cat("ROWNAMES",paste(head(rownames(y),5),collapse="|"),"\n"); cat("COLNAMES",paste(head(colnames(y),10),collapse="|"),"\n")}}}' "/tmp/x${i}.rds"
            rm "/tmp/x${i}.rds"
          done
