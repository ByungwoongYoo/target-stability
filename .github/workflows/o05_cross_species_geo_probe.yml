name: O05 cross-species GEO structure probe

on:
  push:
    branches:
      - o05-cross-species-proteome-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests beautifulsoup4 pandas
      - name: List GEO processed files
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          H={"User-Agent":"o05-cross-species/0.3"}
          for gse in ["GSE325522","GSE325523","GSE325525"]:
              base=f"https://ftp.ncbi.nlm.nih.gov/geo/series/GSE325nnn/{gse}/suppl/"
              r=requests.get(base,headers=H,timeout=120)
              print("DIR",gse,r.status_code,len(r.content),r.url)
              if r.status_code!=200:
                  print(r.text[:1000]); continue
              s=BeautifulSoup(r.text,"html.parser")
              files=[]
              for a in s.find_all("a"):
                  href=a.get("href","")
                  if href and not href.startswith("?") and href not in ["../"]:
                      files.append(href)
              print("FILES",gse,json.dumps(files,ensure_ascii=False))
              # small text metadata / process file probes
              for fn in files:
                  if re.search(r'\.(txt|tsv|csv)(\.gz)?$',fn,re.I):
                      u=base+fn
                      rr=requests.get(u,headers=H,timeout=120,stream=True)
                      print("FILE",gse,fn,rr.status_code,rr.headers.get("content-length"),rr.headers.get("content-type"))
                      # read first 8KB without downloading whole file
                      raw=b""
                      try:
                          for ch in rr.iter_content(8192):
                              raw+=ch
                              if len(raw)>=8192: break
                      except: pass
                      print("HEAD",fn,repr(raw[:8000]))
                      rr.close()
          PY
