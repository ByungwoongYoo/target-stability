name: O03 PPC data table probe

on:
  push:
    branches:
      - o03-ppc-clinical-translation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture PPC drug and AUC endpoints
        shell: bash
        run: |
          mkdir -p o03_ppc_tables
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re,hashlib
          from pathlib import Path
          from playwright.async_api import async_playwright
          OUT=Path("o03_ppc_tables"); OUT.mkdir(exist_ok=True)
          routes=["drugs","aucs","auc_disease","mean_curves","cl_vs_ex_vivo"]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36")
              for route in routes:
                pg=await ctx.new_page(); seen=set()
                async def resp(r,route=route):
                  if "supabase.co/rest/v1/" not in r.url: return
                  key=r.url.split("/rest/v1/")[-1]
                  if key in seen:return
                  seen.add(key)
                  try: body=await r.body()
                  except:return
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',key)[:160]
                  path=OUT/f"{route}__{safe}.bin"
                  path.write_bytes(body)
                  print("TABLE",route,json.dumps({"url":r.url,"status":r.status,"bytes":len(body),
                    "prefix":body[:3500].decode("utf-8","replace")})[:12000])
                pg.on("response",resp)
                try:
                  await pg.goto(f"https://panpreclinical.org/{route}",wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(10000)
                  print("ROUTE_BODY",route,(await pg.locator("body").inner_text())[:5000].replace("\n"," | "))
                except Exception as e: print("ROUTE_ERR",route,repr(e))
                await pg.close()
              await b.close()
          asyncio.run(main())
          print("FILES")
          for p in OUT.iterdir():
            print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o03-ppc-table-probe
          path: o03_ppc_tables/
          retention-days: 3
