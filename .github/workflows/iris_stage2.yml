name: IRIS distant-cell BMP validation

on:
  push:
    branches:
      - iris-validation-20260919
    paths:
      - 'iris_stage2/**'
      - '.github/workflows/iris_stage2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "anndata==0.10.6" "scanpy==1.9.8" "scvi-tools==1.1.2" "scikit-learn==1.4.2" pandas scipy requests h5py mygene
      - name: Run IRIS distant-cell BMP validation
        run: python iris_stage2/run_external_bmp.py
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-stage2-bmp-results
          path: iris_stage2/results/
          if-no-files-found: warn
