name: O07 browser supplement recovery

on:
  push:
    branches:
      - o07-autoimmune-cross-lineage-20260919

jobs:
  browser_recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright pandas openpyxl
          python -m playwright install --with-deps chromium
      - name: Browser recover B/T tables
        shell: bash
        run: |
          mkdir -p o07_browser
          cat > /tmp/o07_browser.py <<'PY'
          import asyncio,io,json,re,hashlib
          from pathlib import Path
          import pandas as pd
          from playwright.async_api import async_playwright

          OUT=Path("o07_browser"); OUT.mkdir(exist_ok=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"

          def inspect(path,label):
              data=Path(path).read_bytes()
              print("FILE",label,len(data),data[:8],hashlib.sha256(data).hexdigest())
              try:
                  xf=pd.ExcelFile(io.BytesIO(data))
                  print("XLS",label,json.dumps(xf.sheet_names))
                  for sh in xf.sheet_names:
                      try:
                          raw=pd.read_excel(io.BytesIO(data),sheet_name=sh,header=None,nrows=10)
                          print("RAW",label,sh,raw.to_json(orient="split",default_handler=str)[:12000])
                          df=pd.read_excel(io.BytesIO(data),sheet_name=sh,nrows=8)
                          print("HDR",label,sh,json.dumps([str(c) for c in df.columns[:160]]))
                      except Exception as e: print("SHEETERR",label,sh,repr(e))
              except Exception as e:
                  print("XLSERR",label,repr(e))

          async def save_response(resp,label):
              try:
                  body=await resp.body()
                  ct=resp.headers.get("content-type","")
                  print("RESP",label,resp.status,ct,len(body),resp.url)
                  if resp.status==200 and len(body)>1000 and (body[:2]==b"PK" or "spreadsheet" in ct or "excel" in ct):
                      p=OUT/(label+".xlsx"); p.write_bytes(body); inspect(p,label)
                      return str(p)
              except Exception as e: print("RESPERR",label,repr(e))
              return None

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA,accept_downloads=True,ignore_https_errors=True)

                  # ---- B: supplementary tab + AJAX fragment ----
                  for idx,u in enumerate([
                    "https://www.biorxiv.org/content/10.64898/2026.03.01.708923v1.supplementary-material",
                    "https://www.biorxiv.org/panels_ajax_tab/biorxiv_tab_data/node:5279601/1",
                  ]):
                      pg=await ctx.new_page()
                      try:
                          await pg.goto(u,wait_until="domcontentloaded",timeout=120000)
                          await pg.wait_for_timeout(5000)
                          print("B_PAGE",idx,await pg.title(),pg.url)
                          print("B_BODY",idx,(await pg.locator("body").inner_text())[:30000])
                          links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                          print("B_LINKS",idx,json.dumps([x for x in links if re.search(r'supp|xlsx|xls|csv|zip|table|download|filestream|adjunct',json.dumps(x),re.I)],indent=2)[:40000])
                          html=await pg.content(); (OUT/f"B_{idx}.html").write_text(html,encoding="utf-8")
                          # click / same-origin fetch likely binary targets
                          candidates=[]
                          for x in links:
                              h=x.get("href") or ""
                              if re.search(r'xlsx|xls|csv|zip|supp|adjunct|filestream',h,re.I):
                                  candidates.append(h)
                          for j,h in enumerate(dict.fromkeys(candidates)):
                              if j>40: break
                              try:
                                  # browser-side fetch preserves session
                                  res=await pg.evaluate("""async (u)=>{const r=await fetch(u,{credentials:'include'}); const b=await r.arrayBuffer(); return {status:r.status,ct:r.headers.get('content-type')||'',url:r.url,bytes:Array.from(new Uint8Array(b))};}""",h)
                                  body=bytes(res["bytes"])
                                  print("B_FETCH",j,res["status"],res["ct"],len(body),res["url"])
                                  if res["status"]==200 and len(body)>1000 and body[:2]==b"PK":
                                      fp=OUT/f"B_supp_{j}.xlsx"; fp.write_bytes(body); inspect(fp,f"B_supp_{j}")
                              except Exception as e: print("B_FETCH_ERR",j,h,repr(e))
                      except Exception as e: print("B_PAGE_ERR",idx,repr(e))
                      await pg.close()

                  # ---- T: open article then fetch supplementary links in page context ----
                  pg=await ctx.new_page()
                  await pg.goto("https://pmc.ncbi.nlm.nih.gov/articles/PMC13060838/",wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(4000)
                  print("T_PAGE",await pg.title(),pg.url)
                  links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                  tlinks=[x for x in links if re.search(r'media-\d+\.xlsx',x.get("href",""),re.I)]
                  print("T_LINKS",json.dumps(tlinks,indent=2)[:40000])
                  for j,x in enumerate(tlinks):
                      h=x["href"]
                      try:
                          res=await pg.evaluate("""async (u)=>{const r=await fetch(u,{credentials:'include'}); const b=await r.arrayBuffer(); return {status:r.status,ct:r.headers.get('content-type')||'',url:r.url,bytes:Array.from(new Uint8Array(b))};}""",h)
                          body=bytes(res["bytes"])
                          print("T_FETCH",j,res["status"],res["ct"],len(body),res["url"],body[:4])
                          if res["status"]==200 and len(body)>1000 and body[:2]==b"PK":
                              m=re.search(r'media-(\d+)\.xlsx',h,re.I)
                              n=m.group(1) if m else str(j)
                              fp=OUT/f"T_media-{n}.xlsx"; fp.write_bytes(body); inspect(fp,f"T_media-{n}")
                      except Exception as e: print("T_FETCH_ERR",j,h,repr(e))
                  await pg.close()
                  await b.close()

          asyncio.run(main())
          print("FINAL",[(p.name,p.stat().st_size) for p in sorted(OUT.iterdir())])
          PY
          python /tmp/o07_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o07-browser-supplements
          path: o07_browser/
          retention-days: 5
