name: O04 CDSDB analysis chunk probe

on:
  push:
    branches:
      - o04-cdsdb-lincs-patient-concordance-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Inspect analysisResult chunks
        run: |
          python - <<'PY'
          import requests,re,json
          base="http://cdsdb.ncpsb.org.cn/js/"
          files=[
            "chunk-19d2ad4c.d3e3c7ea.js",
            "chunk-3a11c3ed.a774c088.js",
            "chunk-26ad118a.a151e069.js",
            "chunk-3df40f2a.777c16b6.js",
            "chunk-95975456.b6ea44f4.js",
          ]
          H={"User-Agent":"Mozilla/5.0"}
          pats=[
            r'analysisResults',r'analysisResult',r'logFC',r'pValue',
            r'downloadData',r'getPreviewImage',r'jobId',r'raw/dataset',
            r'change.*cutoff',r're.?analy',r'/cdsdb/',r'/apiFlask/'
          ]
          for fn in files:
              u=base+fn
              r=requests.get(u,headers=H,timeout=120)
              txt=r.text
              print("===FILE",fn,"STATUS",r.status_code,"LEN",len(txt),"===")
              windows=[]
              for p in pats:
                  for m in re.finditer(p,txt,re.I):
                      a=max(0,m.start()-1000); b=min(len(txt),m.end()+2500)
                      s=txt[a:b]
                      # only keep context with likely endpoint / threshold names
                      if any(k.lower() in s.lower() for k in ["analysisresults","logfc","pvalue","download","jobid","raw/dataset","apiflask","cdsdb/"]):
                          windows.append((m.start(),p,s))
              seen=set()
              for pos,p,s in sorted(windows)[:300]:
                  # stable coarse de-dupe
                  key=re.sub(r'\s+',' ',s)[200:700]
                  if key in seen: continue
                  seen.add(key)
                  print("HIT",p,"POS",pos)
                  print(s)
                  print("---")
          PY
