name: O07 autoimmune cross-lineage data probe

on:
  push:
    branches:
      - o07-autoimmune-cross-lineage-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install requests pandas openpyxl playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
      - name: Recover B-cell and T-cell supplementary tables
        shell: bash
        run: |
          mkdir -p o07_probe
          cat > /tmp/o07_probe.py <<'PY'
          import asyncio,io,json,re,hashlib
          from pathlib import Path
          import requests,pandas as pd
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          OUT=Path("o07_probe"); OUT.mkdir(exist_ok=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"

          def inspect_xlsx(data,label):
              try:
                  xf=pd.ExcelFile(io.BytesIO(data))
              except Exception as e:
                  print("XLS_OPEN_ERR",label,repr(e)); return
              print("XLS",label,"SHEETS",json.dumps(xf.sheet_names))
              for sh in xf.sheet_names:
                  try:
                      raw=pd.read_excel(io.BytesIO(data),sheet_name=sh,header=None,nrows=10)
                      print("RAW",label,sh,raw.to_json(orient="split",default_handler=str)[:8000])
                      df=pd.read_excel(io.BytesIO(data),sheet_name=sh,nrows=6)
                      print("HDR",label,sh,json.dumps([str(c) for c in df.columns[:120]]))
                  except Exception as e: print("SHEET_ERR",label,sh,repr(e))

          async def browser_collect(url,label):
              files=[]
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA,accept_downloads=True,ignore_https_errors=True)
                  pg=await ctx.new_page()
                  try:
                      await pg.goto(url,wait_until="domcontentloaded",timeout=120000)
                      await pg.wait_for_timeout(5000)
                  except Exception as e:
                      print(label,"GOTO_ERR",repr(e))
                  print(label,"TITLE",await pg.title(),"FINAL",pg.url)
                  html=await pg.content()
                  (OUT/f"{label}_page.html").write_text(html,encoding="utf-8")
                  links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                  (OUT/f"{label}_links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")
                  cand=[x for x in links if re.search(r'supp|DC\d|\.xlsx|\.xls|\.zip|\.csv|\.tsv|media-',json.dumps(x),re.I)]
                  print(label,"CAND",json.dumps(cand[:300],indent=2)[:30000])
                  # also hidden URLs
                  hidden=sorted(set(re.findall(r'https?[^"\'<> ]+',html)))
                  hidden=[u for u in hidden if re.search(r'supp|DC\d|\.xlsx|\.xls|\.zip|\.csv|\.tsv|media-',u,re.I)]
                  print(label,"HIDDEN",json.dumps(hidden[:300],indent=2)[:30000])
                  urls=[]
                  for x in cand:
                      if x.get("href"): urls.append(x["href"])
                  urls += hidden
                  seen=set()
                  for i,u in enumerate(urls):
                      if u in seen: continue
                      seen.add(u)
                      try:
                          rr=await ctx.request.get(u,timeout=120000)
                          body=await rr.body(); ct=(rr.headers.get("content-type") or "").lower()
                          print(label,"GET",i,rr.status,ct,len(body),u[:500])
                          if rr.status==200 and len(body)>1000:
                              isbin=(body[:2]==b"PK" or "spreadsheet" in ct or "excel" in ct or "zip" in ct or "csv" in ct or "tab-separated" in ct)
                              if isbin:
                                  ext=".bin"
                                  if body[:2]==b"PK": ext=".xlsx" # try xlsx first
                                  elif "csv" in ct: ext=".csv"
                                  elif "tab-separated" in ct: ext=".tsv"
                                  name=f"{label}_{i}{ext}"
                                  path=OUT/name; path.write_bytes(body); files.append(str(path))
                      except Exception as e: print(label,"GET_ERR",u,repr(e))
                  await b.close()
              return files

          async def main():
              # B-cell bioRxiv / ResearchGate fallback
              bfiles=await browser_collect("https://www.biorxiv.org/content/10.64898/2026.03.01.708923v1","B")
              if not bfiles:
                  more=await browser_collect("https://www.researchgate.net/publication/401492181_Single-cell_CRISPR_activation_screens_in_primary_B_cells_discover_gene_regulatory_mechanisms_for_hundreds_of_autoimmune_risk_loci","BRG")
                  bfiles += more
              # T-cell PMC page
              tfiles=await browser_collect("https://pmc.ncbi.nlm.nih.gov/articles/PMC13060838/","T")
              return bfiles,tfiles

          bfiles,tfiles=asyncio.run(main())
          print("BFILES",json.dumps(bfiles))
          print("TFILES",json.dumps(tfiles))
          for f in bfiles+tfiles:
              data=Path(f).read_bytes()
              inspect_xlsx(data,Path(f).name)
          print("FILES")
          for p in OUT.iterdir():
              if p.is_file():
                  print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python /tmp/o07_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o07-autoimmune-cross-lineage-probe
          path: o07_probe/
          retention-days: 5
