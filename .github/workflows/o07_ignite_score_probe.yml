name: O07 IGNITE score surface probe

on:
  push:
    branches:
      - o07-perturbseq-trial-failure-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright requests pandas openpyxl
          python -m playwright install --with-deps chromium
      - name: Probe IGNITE site and bioRxiv supplement
        shell: bash
        run: |
          mkdir -p o07_probe
          cat > /tmp/probe.py <<'PY'
          import asyncio,re,json,io,zipfile
          from pathlib import Path
          import pandas as pd
          from playwright.async_api import async_playwright

          OUT=Path("o07_probe"); OUT.mkdir(exist_ok=True)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"

          async def inspect_page(ctx,url,label):
              pg=await ctx.new_page()
              reqs=[]; resps=[]
              pg.on("request",lambda r:reqs.append({"method":r.method,"url":r.url,"type":r.resource_type})
                    if re.search(r'csv|tsv|xlsx|json|api|score|gene|download|ignite|supp|media-',r.url,re.I) else None)
              async def cap(r):
                  try:
                      ct=r.headers.get("content-type","")
                      if re.search(r'csv|tsv|xlsx|json|api|score|gene|download|ignite|supp|media-',r.url,re.I) or any(x in ct.lower() for x in ["json","csv","spreadsheet","zip","octet"]):
                          resps.append({"status":r.status,"url":r.url,"ctype":ct,"length":r.headers.get("content-length")})
                  except: pass
              pg.on("response",cap)
              try:
                  await pg.goto(url,wait_until="domcontentloaded",timeout=120000)
                  await pg.wait_for_timeout(8000)
                  print("PAGE",label,"TITLE",await pg.title(),"FINAL",pg.url)
                  body=(await pg.locator("body").inner_text())[:50000]
                  print("BODY",label,body)
                  links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||'',download:e.download||''}))""")
                  buttons=await pg.locator("button").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),id:e.id||'',cls:e.className||''}))""")
                  print("LINKS",label,json.dumps([x for x in links if re.search(r'download|csv|tsv|xlsx|score|supp|data|gene',json.dumps(x),re.I)][:300],indent=2))
                  print("BUTTONS",label,json.dumps(buttons[:200],indent=2))
                  print("REQS",label,json.dumps(reqs[-500:],indent=2))
                  print("RESPS",label,json.dumps(resps[-500:],indent=2))
                  html=await pg.content()
                  (OUT/f"{label}.html").write_text(html,encoding="utf-8")
                  (OUT/f"{label}_links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")
                  # direct fetch candidate binary/data links
                  seen=set()
                  for i,x in enumerate(links):
                      u=x.get("href","")
                      if not u or u in seen: continue
                      if not re.search(r'csv|tsv|xlsx|xls|zip|supp|download|data',u,re.I): continue
                      seen.add(u)
                      try:
                          rr=await ctx.request.get(u,timeout=120000)
                          data=await rr.body(); ct=rr.headers.get("content-type","")
                          print("CANDGET",label,i,rr.status,ct,len(data),u)
                          if rr.status==200 and len(data)>500:
                              ext=".bin"
                              if data[:2]==b"PK": ext=".zip"
                              elif "json" in ct: ext=".json"
                              elif "csv" in ct: ext=".csv"
                              elif "spreadsheet" in ct: ext=".xlsx"
                              dest=OUT/f"{label}_cand_{i}{ext}"; dest.write_bytes(data)
                      except Exception as e: print("CANDERR",label,u,repr(e))
              except Exception as e: print("PAGEERR",label,repr(e))
              await pg.close()

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(user_agent=UA,accept_downloads=True,ignore_https_errors=True)
                  await inspect_page(ctx,"https://ignite.eecs.umich.edu/","ignite")
                  await inspect_page(ctx,"https://www.biorxiv.org/content/10.64898/2026.09.12.748195v1","biorxiv")
                  await b.close()
          asyncio.run(main())

          # inspect downloaded spreadsheet/zip candidates
          for p in OUT.iterdir():
              d=p.read_bytes()
              if d[:2]!=b"PK": continue
              try:
                  xf=pd.ExcelFile(io.BytesIO(d))
                  print("XLS",p.name,xf.sheet_names)
                  for sh in xf.sheet_names:
                      df=pd.read_excel(io.BytesIO(d),sheet_name=sh,nrows=8)
                      print("XLS_SHEET",p.name,sh,"COLS",json.dumps([str(c) for c in df.columns]),"HEAD",df.head(5).to_json(orient="records")[:12000])
              except Exception as e: print("NOT_XLS",p.name,repr(e))
              try:
                  z=zipfile.ZipFile(io.BytesIO(d))
                  print("ZIP",p.name,z.namelist()[:300])
              except: pass
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o07-ignite-probe
          path: o07_probe/
          retention-days: 5
