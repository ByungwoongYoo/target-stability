name: O03 PPC network probe

on:
  push:
    branches:
      - o03-ppc-clinical-translation-20260919

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe PPC web app network
        shell: bash
        run: |
          mkdir -p o03_ppc_probe
          cat > /tmp/probe.py <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path("o03_ppc_probe"); OUT.mkdir(exist_ok=True)
          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                ctx=await b.new_context(
                    user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
                    viewport={"width":1440,"height":1200}
                )
                pg=await ctx.new_page()
                events=[]
                async def onresp(r):
                    ct=r.headers.get("content-type","")
                    u=r.url
                    if re.search(r'api|json|csv|parquet|arrow|data|query|graphql|supabase|s3|blob|storage|duckdb|wasm',u,re.I) or re.search(r'json|csv|parquet|octet-stream',ct,re.I):
                        item={"url":u,"status":r.status,"ctype":ct}
                        try:
                            body=await r.body()
                            item["bytes"]=len(body)
                            if len(body)<200000 and ("json" in ct.lower() or body[:1] in [b"{",b"["]):
                                item["prefix"]=body[:8000].decode("utf-8","replace")
                        except Exception as e:
                            item["body_error"]=repr(e)
                        events.append(item)
                        print("RESP",json.dumps(item)[:12000])
                pg.on("response",onresp)
                await pg.goto("https://panpreclinical.org/",wait_until="domcontentloaded",timeout=120000)
                await pg.wait_for_timeout(12000)
                print("TITLE",await pg.title(),"URL",pg.url)
                body=(await pg.locator("body").inner_text())
                print("BODY",body[:12000].replace("\n"," | "))
                links=await pg.locator("a").evaluate_all("""els=>els.map(e=>({text:(e.innerText||'').trim(),href:e.href||''}))""")
                scripts=await pg.locator("script").evaluate_all("""els=>els.map(e=>({src:e.src||'',text:(e.innerText||'').slice(0,2000)}))""")
                (OUT/"links.json").write_text(json.dumps(links,indent=2),encoding="utf-8")
                (OUT/"scripts.json").write_text(json.dumps(scripts,indent=2),encoding="utf-8")
                (OUT/"events.json").write_text(json.dumps(events,indent=2),encoding="utf-8")
                html=await pg.content(); (OUT/"page.html").write_text(html,encoding="utf-8")
                print("LINK_MATCH",json.dumps([x for x in links if re.search(r'data|download|api|github|csv|drug|compare',json.dumps(x),re.I)][:100],indent=2))
                print("SCRIPT_SRCS",json.dumps([x["src"] for x in scripts if x["src"]][:100],indent=2))
                # Inspect global JS for obvious API/config strings.
                txt=html
                for pat in [r'https?://[^"\' ]+',r'/api/[^"\' ]+',r'[^"\' ]+\.csv',r'[^"\' ]+\.parquet']:
                    vals=[]
                    for m in re.findall(pat,txt,re.I):
                        if m not in vals: vals.append(m)
                    if vals: print("HTML_MATCH",pat,json.dumps(vals[:100]))
                await pg.screenshot(path=str(OUT/"page.png"),full_page=True)
                await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o03-ppc-network-probe
          path: o03_ppc_probe/
          retention-days: 3
