name: IRIS BMP validation lightweight

on:
  push:
    branches:
      - iris-validation-20260919
    paths:
      - 'iris_stage2/**'
      - '.github/workflows/iris_stage2_light.yml'

permissions:
  contents: read

jobs:
  validate-light:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "anndata==0.10.6" "scikit-learn==1.4.2" pandas numpy scipy requests h5py mygene
      - name: Run external BMP gate without scvi
        run: python iris_stage2/run_external_bmp.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-stage2-light-results
          path: iris_stage2/results/
          if-no-files-found: warn
